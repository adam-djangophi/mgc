[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgc"
version = "0.1.0"
description = "Webhook-style event delivery data layer backed by SQLite"
requires-python = ">=3.9"
dependencies = [
	"fastapi>=0.100",
	"httpx>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
mgc = "mgc.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mgc = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
